<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Порт-сканер">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132c56"/>
      <stop offset="0.55" stop-color="#0c2040"/>
      <stop offset="1" stop-color="#061429"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ecbff" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#3b82f6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="bf" x1="0.1" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#8fd6ff"/>
      <stop offset="0.45" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#14306b"/>
    </linearGradient>
    <linearGradient id="pale" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f7ff"/>
      <stop offset="1" stop-color="#cadcff"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8fdcff" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#3b82f6" stop-opacity="0.5"/>
      <stop offset="0.72" stop-color="#2563eb" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5cffa1" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#22c55e" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="innerglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3ea8ff" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#1d4ed8" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0a1a33" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <clipPath id="tileClip">
      <rect x="0" y="0" width="200" height="200" rx="46"/>
    </clipPath>
  </defs>

  <!-- тёмная плитка как на картинке -->
  <g clip-path="url(#tileClip)">
    <rect x="0" y="0" width="200" height="200" fill="url(#tile)"/>
    <circle cx="100" cy="96" r="96" fill="url(#innerglow)" opacity="0.85"/>
  </g>
  <rect x="1.2" y="1.2" width="197.6" height="197.6" rx="45" fill="none"
        stroke="url(#edge)" stroke-width="2"/>

  <g clip-path="url(#tileClip)">
    <g transform="translate(100 100) scale(0.84) translate(-100 -100)">

      <!-- дышащий сияющий ореол -->
      <circle cx="100" cy="100" r="74" fill="#4c8dff" filter="url(#softGlow)" opacity="0.55">
        <animate attributeName="opacity" values="0.3;0.75;0.3" dur="4.6s" repeatCount="indefinite"/>
        <animate attributeName="r" values="66;80;66" dur="4.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="100" cy="100" r="86" fill="url(#halo)" opacity="0.8">
        <animate attributeName="r" values="80;92;80" dur="4.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0.95;0.5" dur="4.6s" repeatCount="indefinite"/>
      </circle>

      <!-- ствол мозга -->
      <path d="M90,146 C92,158 90,166 86,172 L114,172 C110,166 108,158 110,146 Z"
            fill="url(#pale)" opacity="0.85"/>

      <!-- контур мозга с долями -->
      <path d="M100,42
               C90,39 80,42 74,48
               C62,45 51,54 52,64
               C40,67 35,81 44,90
               C34,95 34,111 45,116
               C42,128 53,139 66,136
               C71,148 87,152 97,146
               C99,148 101,148 103,146
               C113,152 129,148 134,136
               C147,139 158,128 155,116
               C166,111 166,95 156,90
               C165,81 160,67 148,64
               C149,54 138,45 126,48
               C120,42 110,39 100,42 Z"
            fill="url(#bf)" stroke="#6aa8ff" stroke-width="4.6" stroke-linejoin="round"/>

      <!-- борозда по центру -->
      <path d="M100,48 C95,62 105,76 100,90 C95,104 105,118 100,132 C98,138 99,142 100,145"
            fill="none" stroke="#07142c" stroke-width="4.5" stroke-linecap="round" opacity="0.5"/>

      <!-- извилины -->
      <g fill="none" stroke="url(#pale)" stroke-width="3.2" stroke-linecap="round" opacity="0.65">
        <path d="M72,56 C63,64 71,72 63,80"/>
        <path d="M57,88 C48,96 56,104 48,112"/>
        <path d="M66,120 C58,128 66,136 76,134"/>
        <path d="M128,56 C137,64 129,72 137,80"/>
        <path d="M143,88 C152,96 144,104 152,112"/>
        <path d="M134,120 C142,128 134,136 124,134"/>
      </g>

      <!-- маршруты импульсов строго по связям -->
      <path id="iA" fill="none" stroke="none"
            d="M72,56 L100,72 L57,88 L48,112 L100,100 L100,72 L72,56 Z"/>
      <path id="iB" fill="none" stroke="none"
            d="M128,56 L100,72 L143,88 L152,112 L100,100 L76,134 L66,120 L48,112 L100,100 L100,72 L128,56 Z"/>
      <path id="iC" fill="none" stroke="none"
            d="M100,100 L124,134 L134,120 L152,112 L100,100 L48,112 L57,88 L100,72 L100,100 Z"/>

      <!-- синапсы -->
      <g stroke="#dbeafe" stroke-width="2.4" stroke-linecap="round" opacity="0.7">
        <line x1="100" y1="72" x2="72" y2="56"/>
        <line x1="100" y1="72" x2="128" y2="56"/>
        <line x1="100" y1="72" x2="57" y2="88"/>
        <line x1="100" y1="72" x2="143" y2="88"/>
        <line x1="57" y1="88" x2="48" y2="112"/>
        <line x1="143" y1="88" x2="152" y2="112"/>
        <line x1="48" y1="112" x2="66" y2="120"/>
        <line x1="152" y1="112" x2="134" y2="120"/>
        <line x1="66" y1="120" x2="76" y2="134"/>
        <line x1="134" y1="120" x2="124" y2="134"/>
        <line x1="48" y1="112" x2="100" y2="100"/>
        <line x1="152" y1="112" x2="100" y2="100"/>
        <line x1="76" y1="134" x2="100" y2="100"/>
        <line x1="124" y1="134" x2="100" y2="100"/>
        <line x1="100" y1="72" x2="100" y2="100"/>
      </g>

      <!-- узлы -->
      <g fill="url(#pale)" stroke="#6aa8ff" stroke-width="2.4">
        <circle cx="100" cy="72" r="8"/>
        <circle cx="72" cy="56" r="6.2"/>
        <circle cx="128" cy="56" r="6.2"/>
        <circle cx="57" cy="88" r="6.2"/>
        <circle cx="143" cy="88" r="6.2"/>
        <circle cx="48" cy="112" r="5.6"/>
        <circle cx="152" cy="112" r="5.6"/>
        <circle cx="66" cy="120" r="5.2"/>
        <circle cx="134" cy="120" r="5.2"/>
        <circle cx="76" cy="134" r="5.2"/>
        <circle cx="124" cy="134" r="5.2"/>
        <circle cx="100" cy="100" r="7"/>
      </g>

      <!-- импульс A -->
      <g>
        <circle r="14" fill="url(#glow)">
          <animateMotion dur="3.7s" repeatCount="indefinite"><mpath href="#iA"/></animateMotion>
        </circle>
        <circle r="4.4" fill="#8dffbd" stroke="#0f8a4c" stroke-width="1">
          <animateMotion dur="3.7s" repeatCount="indefinite"><mpath href="#iA"/></animateMotion>
        </circle>
        <circle r="3.5" fill="#5cffa1" opacity="0.6">
          <animateMotion dur="3.7s" begin="-0.09s" repeatCount="indefinite"><mpath href="#iA"/></animateMotion>
        </circle>
        <circle r="2.6" fill="#4ade80" opacity="0.4">
          <animateMotion dur="3.7s" begin="-0.18s" repeatCount="indefinite"><mpath href="#iA"/></animateMotion>
        </circle>
        <circle r="1.9" fill="#22c55e" opacity="0.22">
          <animateMotion dur="3.7s" begin="-0.27s" repeatCount="indefinite"><mpath href="#iA"/></animateMotion>
        </circle>
      </g>

      <!-- импульс B -->
      <g>
        <circle r="11" fill="url(#glow)">
          <animateMotion dur="5.9s" begin="-1.7s" repeatCount="indefinite"><mpath href="#iB"/></animateMotion>
        </circle>
        <circle r="3.8" fill="#8dffbd" stroke="#0f8a4c" stroke-width="1">
          <animateMotion dur="5.9s" begin="-1.7s" repeatCount="indefinite"><mpath href="#iB"/></animateMotion>
        </circle>
        <circle r="2.9" fill="#5cffa1" opacity="0.55">
          <animateMotion dur="5.9s" begin="-1.8s" repeatCount="indefinite"><mpath href="#iB"/></animateMotion>
        </circle>
        <circle r="2.1" fill="#4ade80" opacity="0.33">
          <animateMotion dur="5.9s" begin="-1.9s" repeatCount="indefinite"><mpath href="#iB"/></animateMotion>
        </circle>
      </g>

      <!-- импульс C -->
      <g>
        <circle r="11" fill="url(#glow)">
          <animateMotion dur="5.1s" begin="-3.2s" repeatCount="indefinite"><mpath href="#iC"/></animateMotion>
        </circle>
        <circle r="3.6" fill="#8dffbd" stroke="#0f8a4c" stroke-width="1">
          <animateMotion dur="5.1s" begin="-3.2s" repeatCount="indefinite"><mpath href="#iC"/></animateMotion>
        </circle>
        <circle r="2.8" fill="#5cffa1" opacity="0.55">
          <animateMotion dur="5.1s" begin="-3.3s" repeatCount="indefinite"><mpath href="#iC"/></animateMotion>
        </circle>
        <circle r="2" fill="#4ade80" opacity="0.3">
          <animateMotion dur="5.1s" begin="-3.4s" repeatCount="indefinite"><mpath href="#iC"/></animateMotion>
        </circle>
      </g>

      <!-- мерцание узлов -->
      <g fill="#5cffa1">
        <circle cx="72" cy="56" r="2.4">
          <animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.5s" begin="0s" repeatCount="indefinite"/>
        </circle>
        <circle cx="128" cy="56" r="2.4">
          <animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.5s" begin="0.62s" repeatCount="indefinite"/>
        </circle>
        <circle cx="57" cy="88" r="2.2">
          <animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.5s" begin="1.24s" repeatCount="indefinite"/>
        </circle>
        <circle cx="143" cy="88" r="2.2">
          <animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.5s" begin="1.86s" repeatCount="indefinite"/>
        </circle>
        <circle cx="76" cy="134" r="2">
          <animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.5s" begin="0.4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="124" cy="134" r="2">
          <animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.5s" begin="1.1s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
  </g>
</svg>
